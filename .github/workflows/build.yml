name: Сборка мода

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: emerald-economy-mod
          path: build/libs/*.jar
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Изумрудная власть (последняя сборка)
          body: Скачайте emerald-economy-1.0.0.jar и положите в папку mods (Minecraft 1.20.1 + Fabric Loader + Fabric API).
          files: build/libs/emerald-economy-*.jar
          make_latest: true
